# Reusable gate: a pull request merges only with a fresh `review:approved` verdict.
# Each repository calls it from `.github/workflows/review-label.yml`; the main-protection ruleset
# requires the resulting check. A push (`synchronize`) always fails, because the verdict belonged
# to the previous head: the reviewer re-applies the label after reviewing the new SHA.
name: review-label

on:
  workflow_call:

permissions: {}

jobs:
  review-label:
    name: review-label
    runs-on: ubuntu-latest
    steps:
      - name: Require a fresh review:approved
        env:
          ACTION: ${{ github.event.action }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'review:approved') }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$ACTION" = "synchronize" ]; then
            echo "::error::New commits since the last verdict. The reviewer re-applies review:approved after reviewing $HEAD_SHA."
            exit 1
          fi
          if [ "$APPROVED" != "true" ]; then
            echo "::error::This pull request lacks review:approved."
            exit 1
          fi
          echo "review:approved present for $HEAD_SHA"
